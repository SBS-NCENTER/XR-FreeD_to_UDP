; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / `pio run -t upload`이 보드 환경만 대상으로 하게 한다.
; native 단위 테스트는 `pio test -e native`로 명시 실행.
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

; Exact pin (no caret): main.cpp depends on library internals via
; <utility/w5100.h> (async Sock_SEND issue + raw RTR/RCR register writes).
; Re-verify those code paths before ever bumping this version.
lib_deps = arduino-libraries/Ethernet@2.0.2

; 개발 중이거나 치명적 오류를 현장에서 진단할 때만 쓰는 빌드 — serial 콘솔
; (processCommand/printNetworkStatus)과 DEBUG_PRINT를 켠다. 새 보드 bring-up도
; 그 용도 중 하나일 뿐, 정의는 아니다. production 빌드에서 serial이 꺼져 있는
; 이유(FreeD hot path 지터)는 README "설계 노트" 참고.
[env:uno_r4_wifi_debug]
extends = env:uno_r4_wifi
build_flags = -D DEBUG_SERIAL_MONITOR=1

; 호스트에서 도는 순수 로직 단위 테스트 전용 환경 (보드 불필요).
; include/ 의 Arduino 비의존 헤더만 대상으로 한다.
[env:native]
platform = native
test_framework = unity
build_flags = -I include
